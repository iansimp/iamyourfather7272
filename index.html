<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Schoolwork</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2333; --muted: #6b7280;
    --line: #e5e7eb; --red: #dc2626; --redbg: #fef2f2; --amber: #b45309;
    --amberbg: #fffbeb; --green: #15803d; --greenbg: #f0fdf4; --blue: #1d4ed8;
    --bluebg: #eff6ff; --purple: #7e22ce; --purplebg: #faf5ff;
  }
  .schlink { font-size: 12px; color: var(--blue); text-decoration: none; white-space: nowrap; }
  .schlink:hover { text-decoration: underline; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.45; }
  header { background: var(--ink); color: #fff; padding: 18px 20px 0; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 4px 0 10px; font-size: 12px; color: #b6bdc9; }
  .syncstat { font-size: 12px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; }
  .tab { background: none; border: none; color: #b6bdc9; font: inherit; font-size: 14px; font-weight: 600;
         padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--bg); color: var(--ink); }
  .tab .n { background: var(--red); color: #fff; border-radius: 999px; font-size: 11px;
            padding: 1px 7px; margin-left: 5px; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 16px 16px 60px; }
  .controls { display: flex; gap: 10px; margin: 4px 0 18px; flex-wrap: wrap; align-items: center; }
  select, input[type="date"], input[type="text"] { font-size: 14px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; font-family: inherit; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
  h2 .count { background: var(--ink); color: #fff; border-radius: 999px; font-size: 12px;
              padding: 1px 9px; margin-left: 6px; vertical-align: 2px; }
  h2 .count.red { background: var(--red); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 6px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
          cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .stat:hover { border-color: #c7cdd6; }
  .stat .num { font-size: 24px; font-weight: 750; }
  .stat .lbl { font-size: 13px; font-weight: 650; margin-top: 2px; }
  .stat .def { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .stat.alert .num { color: var(--red); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; }
  .card.overdue { border-left: 4px solid var(--red); }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .title { font-weight: 650; font-size: 15px; margin: 0; }
  .course { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; font-size: 12px; align-items: center; }
  .tag { border-radius: 999px; padding: 2px 10px; font-weight: 600; background: #eef0f3; color: #374151; }
  .due { font-weight: 600; }
  .due.late { color: var(--red); }
  .badge { border-radius: 999px; padding: 2px 10px; font-weight: 700; white-space: nowrap; font-size: 12px; }
  .badge.missing { background: var(--redbg); color: var(--red); }
  .badge.submitted { background: var(--bluebg); color: var(--blue); }
  .badge.graded { background: var(--greenbg); color: var(--green); }
  .badge.completed { background: var(--greenbg); color: var(--green); }
  .badge.nag { background: var(--amberbg); color: var(--amber); }
  .badge.workstrip { background: var(--bluebg); color: var(--blue); }
  .badge.setaside { background: #eef0f3; color: var(--muted); }
  .comment { background: #f9fafb; border-left: 3px solid var(--line); padding: 8px 12px;
             font-size: 13px; margin: 10px 0 4px; border-radius: 0 8px 8px 0; }
  .comment b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
               color: var(--muted); margin-bottom: 2px; }
  .note-row { margin-top: 10px; }
  textarea { width: 100%; font: inherit; font-size: 13px; border: 1px solid var(--line);
             border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 34px; }
  textarea::placeholder { color: #9ca3af; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 4px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .btn { font: inherit; font-size: 14px; font-weight: 650; border-radius: 10px; padding: 10px 16px;
         border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .btn:hover { border-color: #9ca3af; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
  .btn.quiet { background: none; border-color: transparent; color: var(--muted); font-weight: 500; }
  .btn.small { font-size: 13px; padding: 7px 12px; }

  /* checklist (Today) */
  .check { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           padding: 14px 16px; margin-bottom: 10px; }
  .check.deferred { border-left: 4px solid var(--amber); }
  .check.done-today { opacity: .75; }
  .check .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .check .dayline { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .deferbox { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .deferbox input[type="text"] { flex: 1; min-width: 180px; }
  .reason { background: var(--amberbg); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }
  .nagbox { background: var(--amberbg); border: 1px solid #fde68a; border-radius: 12px;
            padding: 12px 16px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center;
            justify-content: space-between; flex-wrap: wrap; }

  /* calendar (Planner) */
  .tray { background: var(--redbg); border: 1px solid #fecaca; border-radius: 12px;
          padding: 12px 16px; margin: 14px 0; }
  .tray h3 { margin: 0 0 8px; font-size: 14px; color: var(--red); }
  .traychips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tchip { background: #fff; border: 1px solid #fecaca; border-radius: 999px; padding: 6px 12px;
           font-size: 13px; cursor: pointer; font-family: inherit; }
  .tchip:hover { border-color: var(--red); }
  .calweek { margin-bottom: 14px; }
  .calweek > h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .daycell { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
             padding: 8px; min-height: 110px; }
  .daycell.today { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .daycell h4 { margin: 0 0 2px; font-size: 12.5px; }
  .daycell .dsub { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
  .dchip { display: block; width: 100%; text-align: left; border-radius: 7px; padding: 4px 7px;
           font-size: 11.5px; margin-bottom: 5px; cursor: pointer; border: 1px solid transparent;
           font-family: inherit; line-height: 1.3; }
  .dchip.due { background: var(--redbg); border-color: #fecaca; color: #7f1d1d; font-weight: 650; }
  .dchip.work { background: var(--bluebg); border-color: #bfdbfe; color: #1e3a8a; }
  .dchip .sub { display: block; font-weight: 400; font-size: 10px; opacity: .8; }
  .detail { background: var(--card); border: 2px solid var(--ink); border-radius: 14px;
            padding: 18px; margin: 16px 0; }
  .detail .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  @media (max-width: 760px) { .cal { grid-template-columns: 1fr; } .daycell { min-height: 0; } }

  /* triage */
  .focus { background: var(--card); border: 2px solid var(--ink); border-radius: 16px;
           padding: 22px; margin: 16px 0; }
  .focus-progress { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                    color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .focus .title { font-size: 19px; }
  .suggest { background: var(--bluebg); border-radius: 10px; padding: 10px 14px; font-size: 13px;
             margin: 12px 0; color: #1e3a8a; }
  .decide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pickrow { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .summary { background: var(--greenbg); border: 1px solid #bbf7d0; border-radius: 12px;
             padding: 16px 18px; margin: 16px 0; font-size: 14px; }
  .grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .grade-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
                padding: 12px 14px; }
  .grade-card .g-course { font-size: 13px; font-weight: 600; }
  .grade-card .g-val { font-size: 22px; font-weight: 750; margin-top: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Schoolwork</h1>
  <p><span id="fetched">Loading…</span> · <span id="syncstat" class="syncstat">Syncing…</span></p>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="planner">Planner</button>
    <button class="tab" data-tab="tackle">Tackle<span class="n" id="tackleBadge" style="display:none"></span></button>
    <button class="tab" data-tab="grades">Grades</button>
  </nav>
</header>
<div class="wrap">
  <div class="controls">
    <select id="courseFilter"><option value="">All courses</option></select>
  </div>

  <section id="tab-today"></section>
  <section id="tab-planner" style="display:none"></section>
  <section id="tab-tackle" style="display:none"></section>
  <section id="tab-grades" style="display:none"></section>
</div>
<footer>Read-only view of Schoology. Notes, plans and check-ins sync across this family's devices.</footer>

<script>
// Shared sync store (Google Apps Script web app; anyone-with-the-link, same
// privacy model as this dashboard). Each map is id -> {v, ts}; last write wins
// per key. Clearing a value stores a tombstone ({v:""}/{v:false}) so deletions
// propagate instead of resurrecting.
const SYNC_URL = "https://script.google.com/macros/s/AKfycbxLyT8zIchjSUCOs2ZuBBh2ctCn6tsTE1DppVW-bfrzUM-hXUeXy60rmyGK9ZG3NwAb/exec";
const LS_STATE = "sw_state_v2";
const MAPS = ["notes", "done", "submitted", "plan", "dropped", "daily", "duedates", "noise", "snoozed"];
let notes = {}, done = {}, submitted = {}, plan = {}, dropped = {}, daily = {}, duedates = {}, noise = {}, snoozed = {};
const MAPREF = () => ({notes, done, submitted, plan, dropped, daily, duedates, noise, snoozed});
try {
  const c = JSON.parse(localStorage.getItem(LS_STATE) || "{}");
  notes = c.notes || {}; done = c.done || {}; submitted = c.submitted || {};
  plan = c.plan || {}; dropped = c.dropped || {}; daily = c.daily || {}; duedates = c.duedates || {};
  noise = c.noise || {}; snoozed = c.snoozed || {};
} catch (e) { /* corrupted cache: start clean, remote will refill */ }
const saveLocal = () => { try { localStorage.setItem(LS_STATE, JSON.stringify({notes, done, submitted, plan, dropped, daily, duedates, noise, snoozed})); } catch (e) {} };
const noteOf = id => (notes[id] && notes[id].v) || "";
const isDone = id => !!(done[id] && done[id].v);
const isSubmitted = id => !!(submitted[id] && submitted[id].v);
const planOf = id => (plan[id] && plan[id].v) || "";
const isDropped = id => !!(dropped[id] && dropped[id].v);
const isNoise = id => !!(noise[id] && noise[id].v);
// Snoozed items auto-wake on their `until` day (stored as a YYYY-MM-DD dayKey);
// no `until` means snoozed indefinitely until brought back by hand.
const isSnoozed = id => {
  const s = snoozed[id];
  if (!s || !s.v) return false;
  return !s.until || s.until > todayKey();
};
const snoozeUntil = days => {
  const d = new Date(); d.setDate(d.getDate() + days);
  return dayKey(d);
};
const wakeLabel = id => {
  const s = snoozed[id];
  return (s && s.until) ? "wakes " + planLabel(s.until) : "snoozed indefinitely";
};
// Duration picker shown inline wherever a Snooze button lives.
const SNOOZE_DURS = [["3", "3 days"], ["7", "1 week"], ["14", "2 weeks"], ["30", "1 month"], ["", "Indefinitely"]];
const snoozeChips = (a, tdec) => SNOOZE_DURS.map(([d, label]) =>
  tdec ? `<button class="btn small" data-tdec="snoozego" data-id="${a.id}" data-days="${d}">${label}</button>`
       : `<button class="btn small" data-snoozego="${a.id}" data-days="${d}">${label}</button>`).join("");
const snoozePickerRow = (a, tdec) =>
  `<div class="decide"><span style="font-size:13px;color:var(--muted)">Snooze for:</span>${snoozeChips(a, tdec)}
   <button class="btn small quiet" data-snoozecancel title="Cancel">✕</button></div>`;
const dayRecOf = (id, k) => daily[id + "||" + k] || null;
/* Manual due dates: Ian/Luke can assign a due date to anything (mostly items
   with no Schoology deadline). Stored as a day key "YYYY-MM-DD"; beats the
   Schoology date everywhere until cleared. */
const manualDueK = id => (duedates[id] && duedates[id].v) || "";
const effDue = a => { const m = manualDueK(a.id); return m ? m + "T12:00:00" : (a.due_at || null); };
const hasManualDue = a => !!manualDueK(a.id);

function mergeState(remote) {
  let changed = false;
  const local = MAPREF();
  for (const m of MAPS) {
    const l = local[m], r = (remote && remote[m]) || {};
    for (const k in r) {
      const cur = l[k], inc = r[k];
      if (!cur || (inc.ts || 0) >= (cur.ts || 0)) {
        if (!cur || cur.v !== inc.v || cur.ts !== inc.ts || (cur.note || "") !== (inc.note || "")) { l[k] = inc; changed = true; }
      }
    }
  }
  if (changed) saveLocal();
  return changed;
}

let pushTimer = null, pendingPush = false, syncStatus = "starting";
function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById("syncstat");
  if (!el) return;
  const map = {
    saving: ["Saving…", "var(--muted)"],
    saved: ["Saved ✓", "var(--green)"],
    offline: ["Offline — will retry", "var(--red)"],
    starting: ["Syncing…", "var(--muted)"]
  };
  const [txt, col] = map[s] || map.starting;
  el.textContent = txt;
  el.style.color = col;
}
// Push with a real acknowledgement: HTTP ok AND a JSON body containing the
// state maps. Anything else marks the write pending and retries it on the
// next successful poll, on reconnect, or on page hide.
function pushState(opts = {}) {
  clearTimeout(pushTimer); pushTimer = null;
  pendingPush = false;
  setSyncStatus("saving");
  fetch(SYNC_URL + "?action=write&data=" + encodeURIComponent(JSON.stringify(MAPREF())), opts.keepalive ? {keepalive: true} : {})
    .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(remote => {
      if (!remote || typeof remote !== "object" || !("notes" in remote)) throw new Error("bad ack");
      setSyncStatus("saved");
    })
    .catch(() => { pendingPush = true; setSyncStatus("offline"); });
}
const pushSoon = ms => { clearTimeout(pushTimer); pushTimer = setTimeout(pushState, ms); };
function pullState(cb) {
  fetch(SYNC_URL + "?action=read").then(r => r.json()).then(remote => {
    const changed = mergeState(remote);
    if (pendingPush) pushState(); // a write failed earlier — retry now
    else if (syncStatus === "starting" || syncStatus === "offline") setSyncStatus("saved");
    cb(changed);
  }).catch(() => { setSyncStatus("offline"); cb(false); });
}
window.addEventListener("online", () => { if (pendingPush) pushState(); });
window.addEventListener("pagehide", () => { if (pushTimer || pendingPush) pushState({keepalive: true}); });

// One-time migration from the old per-browser format (course|title|due keys).
function migrateLegacy() {
  let changed = false;
  try {
    const ln = JSON.parse(localStorage.getItem("sw_notes_v1") || "{}");
    const lt = JSON.parse(localStorage.getItem("sw_turned_v1") || "[]");
    if (Object.keys(ln).length || lt.length) {
      const byKey = {};
      DATA.assignments.forEach(a => { byKey[[a.course, a.title, a.due_at || ""].join("|").replace(/"/g, "")] = a.id; });
      for (const k in ln) {
        const id = byKey[k];
        if (id && !notes[id] && ln[k]) { notes[id] = {v: ln[k], ts: 0}; changed = true; }
      }
      lt.forEach(k => {
        const id = byKey[k];
        if (id && !done[id]) { done[id] = {v: true, ts: 0}; changed = true; }
      });
      localStorage.removeItem("sw_notes_v1");
      localStorage.removeItem("sw_turned_v1");
    }
  } catch (e) {}
  if (changed) { saveLocal(); pushSoon(500); }
}

const TZ = "America/Los_Angeles";
const dayFmt = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: TZ });
const dtFmt = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sAbs = u => u && u.startsWith("/") ? "https://lausd.schoology.com" + u : u;
const sLink = a => a.url ? ` <a class="schlink" href="${esc(sAbs(a.url))}" target="_blank" rel="noopener">Schoology ↗</a>` : "";
/* Same status buttons on every card, everywhere. noDone/noSub hide one side
   where the card already has that action (e.g. triage decisions). */
function statusRow(a, opts = {}) {
  const d = isDone(a.id), s = isSubmitted(a.id);
  let h = `<div class="decide" style="margin-top:8px">`;
  if (!opts.noDone) h += `<button class="btn small ${d ? "primary" : ""}" data-mdone="${a.id}">${d ? "Done ✓" : "Mark done"}</button>`;
  if (!opts.noSub) h += `<button class="btn small ${s ? "blue" : ""}" data-msub="${a.id}">${s ? "Submitted ✓" : "Mark submitted"}</button>`;
  return h + `</div>`;
}
const dayKey = d => new Date(d).toLocaleString("en-CA", { timeZone: TZ }).slice(0, 10);
const todayKey = () => dayKey(new Date());
const parseK = k => new Date(k + "T12:00:00");
const addDaysK = (k, n) => dayKey(new Date(parseK(k).getTime() + n * 864e5));
function planLabel(iso) {
  if (!iso) return "";
  const t = todayKey();
  if (iso === t) return "Today";
  if (iso === dayKey(Date.now() + 864e5)) return "Tomorrow";
  return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: TZ }).format(parseK(iso));
}
function relDay(iso) {
  if (!iso) return "No due date";
  const now = new Date();
  const day = s => new Date(s.toLocaleString("en-US", { timeZone: TZ })).setHours(0,0,0,0);
  const diff = Math.round((day(new Date(iso)) - day(now)) / 864e5);
  if (diff === 0) return "Due today";
  if (diff === 1) return "Due tomorrow";
  if (diff === -1) return "1 day overdue";
  if (diff < 0) return `${-diff} days overdue`;
  return "Due " + dayFmt.format(new Date(iso));
}

/* ----- planning model: start day -> work strip through due date -----
   workDays(a): every day from the chosen start through the due date (or, for
   overdue items, a 3-day catch-up window). Deferring a day extends the strip
   by a day so the work never silently vanishes. */
function baseEndK(a, startK) {
  const ed = effDue(a);
  if (!ed) return null; // open-ended: every day from start until completed
  const dueK = dayKey(new Date(ed));
  return dueK >= startK ? dueK : addDaysK(startK, 2);
}
function maxDeferredK(id) {
  let mx = null;
  const pre = id + "||";
  for (const k in daily) {
    if (k.indexOf(pre) === 0 && daily[k].v === "deferred") {
      const dk = k.slice(pre.length);
      if (!mx || dk > mx) mx = dk;
    }
  }
  return mx;
}
function endK(a) {
  const s = planOf(a.id);
  if (!s) return null;
  let e = baseEndK(a, s);
  const md = maxDeferredK(a.id);
  if (md) {
    const ext = addDaysK(md, 1);
    if (!e || ext > e) e = ext;
  }
  return e;
}
function workDays(a) {
  const s = planOf(a.id);
  if (!s) return [];
  const e = endK(a), out = [];
  if (!e) { // no due date: show the coming 14 days from start
    for (let i = 0; i < 14; i++) out.push(addDaysK(s, i));
    return out;
  }
  for (let k = s, n = 0; k <= e && n < 90; k = addDaysK(k, 1), n++) out.push(k);
  return out;
}
function activeOn(a, k) {
  if (!planOf(a.id) || isDone(a.id) || isDropped(a.id) || isNoise(a.id) || isSnoozed(a.id)) return false;
  const s = planOf(a.id), e = endK(a);
  if (!e) return k >= s && k <= addDaysK(s, 13); // no due date: 14-day window from start
  return k >= s && k <= e;
}
// A plan whose window ended without the work being finished. These vanish
// from Today and the calendar but still carry a plan, so they don't appear in
// the unplanned lists either — without this they become hard to find.
function planExpired(a) {
  const s = planOf(a.id);
  if (!s || isDone(a.id) || isDropped(a.id) || isNoise(a.id) || isSnoozed(a.id)) return false;
  const e = endK(a);
  const lastK = e || addDaysK(s, 13); // mirrors activeOn's 14-day undated window
  return lastK < todayKey();
}
function dayPos(a, k) {
  const days = workDays(a), i = days.indexOf(k);
  const e = endK(a);
  if (i < 0) return "";
  return e ? `Day ${i + 1} of ${days.length}` : `Day ${i + 1}`;
}
function suggestStart(a) {
  const t = todayKey();
  const ed = effDue(a);
  if (!ed) return t;
  const dueK = dayKey(new Date(ed));
  if (dueK <= t) return t; // overdue: start today, catch-up window applies
  const s = addDaysK(dueK, -3);
  return s < t ? t : s;
}

function statusBadge(a) {
  if (isSubmitted(a.id)) return `<span class="badge submitted">Submitted ✓</span>`;
  if (isDone(a.id)) return `<span class="badge nag">Completed — submit it!</span>`;
  if (isDropped(a.id)) return `<span class="badge setaside">Set aside</span>`;
  let out = "";
  const s = planOf(a.id);
  if (s) {
    const e = endK(a);
    out += `<span class="badge workstrip">${esc(dayPos(a, todayKey()) || ("Starts " + planLabel(s)))}${e ? " · due " + esc(planLabel(e)) : ""}</span>`;
  }
  const st = (a.status || "").toLowerCase();
  if (["missing", "incomplete", "missing annotation"].includes(st))
    out += `<span class="badge missing">${esc(a.status)}</span>`;
  else if (st === "submitted") out += `<span class="badge submitted">Submitted</span>`;
  else if (st === "graded") out += `<span class="badge graded">${esc(a.grade || "Graded")}</span>`;
  else if (st) out += `<span class="badge">${esc(a.status)}</span>`;
  return out;
}

// Red "late" styling is reserved for work someone still needs to do —
// submitted, graded, exempt, or collected items never get it just because
// their deadline passed.
function needsAction(a) {
  const ed = effDue(a);
  return !!(ed && new Date(ed) < new Date() && !isDone(a.id) && !isSubmitted(a.id)
    && !GRADED(a.status) && !RESOLVED_STATUS(a.status));
}
function card(a) {
  const ed = effDue(a);
  const late = needsAction(a);
  const dueCls = late ? "due late" : "due";
  return `<div class="card ${late ? "overdue" : ""}">
    <div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
    <p class="course">${esc(a.course)}${sLink(a)}</p>
    <div class="meta"><span class="tag">${esc(a.type || "other")}</span>
      ${hasPts(a) ? `<span class="tag">${esc(ptsTxt(a))}</span>` : ""}
      <span class="${dueCls}">${esc(relDay(ed))}${ed ? " · " + esc(dtFmt.format(new Date(ed))) : ""}</span>
      ${hasManualDue(a) ? `<span class="tag" title="You assigned this date; clear it in the Planner to go back to Schoology's">due date set by you</span>` : ""}
    </div>
    ${a.teacher_comment ? `<div class="comment"><b>Teacher comment</b>${esc(a.teacher_comment)}</div>` : ""}
    ${statusRow(a)}
    <div class="note-row"><textarea placeholder="Add a note…" data-note="${a.id}">${esc(noteOf(a.id))}</textarea></div>
  </div>`;
}

let DATA = null, courseFilter = "", activeTab = "today";
let selectedId = null, deferFor = null, schedFor = null, snoozeFor = null;
let triageSession = false, triagePos = 0, triageSummary = null;
const MISSING = s => ["missing", "incomplete", "missing annotation"].includes((s || "").toLowerCase());
const GRADED = s => ["graded", "submitted"].includes((s || "").toLowerCase());
// Schoology statuses that mean "nothing to do". Absent is deliberately NOT
// here — it stays in triage with its label until someone makes the call.
const RESOLVED_STATUS = s => ["exempt", "collected"].includes((s || "").toLowerCase());
// Points arrive as strings and are "" when Schoology has none — "" is not a value.
const hasPts = a => a.points !== "" && a.points != null;
const ptsTxt = a => `${a.points} pt${String(a.points) === "1" ? "" : "s"}`;
// One definition of "nothing left to do": family-marked done/submitted, or
// Schoology says graded, submitted, exempt, or collected.
const isResolved = a => isDone(a.id) || isSubmitted(a.id) || GRADED(a.status) || RESOLVED_STATUS(a.status);
const byId = id => DATA.assignments.find(a => a.id === id);

function lists() {
  const list = DATA.assignments.filter(a => !courseFilter || a.course === courseFilter);
  const now = new Date(), cutoff = new Date(now - 30 * 864e5);
  const past = a => { const ed = effDue(a); return ed && new Date(ed) < now; };
  const byDue = (x, y) => new Date(effDue(x)) - new Date(effDue(y));
  const L = {};
  L.overdue = list.filter(a => past(a) && MISSING(a.status) && !isDone(a.id) && !isDropped(a.id) && !isNoise(a.id) && !isSnoozed(a.id)).sort(byDue);
  L.triage = L.overdue.filter(a => !planOf(a.id) && !isSubmitted(a.id));
  L.upcoming = list.filter(a => { const ed = effDue(a); return ed && new Date(ed) >= now && !isDone(a.id) && !isSubmitted(a.id) && !GRADED(a.status) && !RESOLVED_STATUS(a.status) && !isNoise(a.id) && !isSnoozed(a.id); }).sort(byDue);
  L.unplannedUpcoming = L.upcoming.filter(a => !planOf(a.id) && !isDropped(a.id));
  L.recent = list.filter(a => { const ed = effDue(a); return GRADED(a.status) && ed && new Date(ed) >= cutoff && !isDone(a.id); })
    .sort((x, y) => new Date(effDue(y)) - new Date(effDue(x)));
  L.look = list.filter(a => past(a) && !MISSING(a.status) && !GRADED(a.status) && !RESOLVED_STATUS(a.status) && !isDone(a.id) && !isDropped(a.id) && !planOf(a.id) && !isSubmitted(a.id) && !isNoise(a.id) && !isSnoozed(a.id)).sort(byDue);
  L.nodate = list.filter(a => !effDue(a) && !isDone(a.id) && !GRADED(a.status) && !RESOLVED_STATUS(a.status) && !isDropped(a.id) && !isNoise(a.id) && !isSnoozed(a.id));
  L.unplannedNodate = L.nodate.filter(a => !planOf(a.id));
  L.dropped = list.filter(a => isDropped(a.id));
  L.noise = list.filter(a => isNoise(a.id));
  L.snoozed = list.filter(a => isSnoozed(a.id));
  L.expired = list.filter(a => planExpired(a)).sort(byDue);
  const t = todayKey();
  L.todayActive = list.filter(a => activeOn(a, t) && !isResolved(a)).sort(byDue);
  L.needsSubmit = list.filter(a => isDone(a.id) && !isSubmitted(a.id) && !isNoise(a.id) && !isSnoozed(a.id));
  const weekAgo = Date.now() - 7 * 864e5;
  L.submittedRecent = list.filter(a => isSubmitted(a.id) && (submitted[a.id].ts || 0) >= weekAgo);
  L.dueWeek = L.upcoming.filter(a => new Date(effDue(a)) < new Date(now.getTime() + 7 * 864e5));
  return L;
}

/* ---------- Today: the daily checklist ---------- */
function checkRow(a, L) {
  const t = todayKey(), rec = dayRecOf(a.id, t);
  const state = rec ? rec.v : "pending";
  let inner = `<div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
    <p class="course">${esc(a.course)}</p>
    <div class="dayline">${esc(dayPos(a, t))} · ${esc(relDay(effDue(a)))}${hasPts(a) ? ` · ${esc(ptsTxt(a))}` : ""}${sLink(a)}</div>
    ${a.teacher_comment ? `<div class="comment"><b>Teacher comment</b>${esc(a.teacher_comment)}</div>` : ""}`;
  if (state === "did") {
    inner += `<div class="actions"><span class="badge completed">Today's portion done ✓</span>
      <button class="btn small primary" data-complete="${a.id}">Completed</button>
      <button class="btn small blue" data-submit="${a.id}">Submitted</button></div>`;
    return `<div class="check done-today">${inner}</div>`;
  }
  if (state === "deferred") {
    inner += `<div class="reason"><b>Deferred to tomorrow:</b> ${esc(rec.note || "no reason given")}</div>
      <div class="actions"><button class="btn small primary" data-complete="${a.id}">Completed</button>
      <button class="btn small blue" data-submit="${a.id}">Submitted</button></div>`;
    return `<div class="check deferred">${inner}</div>`;
  }
  inner += `<div class="actions">
      <button class="btn small primary" data-did="${a.id}">Did today's portion</button>
      <button class="btn small" data-defer="${a.id}">Defer to tomorrow</button>
      <button class="btn small" data-complete="${a.id}">Completed</button>
      <button class="btn small blue" data-submit="${a.id}">Submitted</button>
    </div>`;
  if (deferFor === a.id) {
    inner += `<div class="deferbox"><input type="text" id="deferreason" placeholder="Why is this moving to tomorrow? (required)">
      <button class="btn small amber" data-defergo="${a.id}">Confirm defer</button>
      <button class="btn small quiet" data-defercancel>Cancel</button></div>`;
  }
  return `<div class="check">${inner}</div>`;
}

function renderToday(L) {
  const el = document.getElementById("tab-today");
  const t = todayKey();
  const todo = L.todayActive.filter(a => { const r = dayRecOf(a.id, t); return !r || (r.v !== "did" && r.v !== "deferred"); });
  const didT = L.todayActive.filter(a => (dayRecOf(a.id, t) || {}).v === "did");
  const defT = L.todayActive.filter(a => (dayRecOf(a.id, t) || {}).v === "deferred");
  const dstr = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: TZ }).format(new Date());
  let h = `<h2 style="margin-top:6px">${esc(dstr)}<span class="count">${todo.length} to do</span></h2>`;
  if (L.triage.length) {
    h += `<div class="nagbox"><p style="margin:0"><b>${L.triage.length} overdue</b> still need${L.triage.length === 1 ? "s" : ""} a plan.</p>
      <button class="btn small amber" data-goto="tackle">Tackle them</button></div>`;
  }
  h += todo.length ? todo.map(a => checkRow(a, L)).join("")
    : `<div class="empty">${L.todayActive.length ? "Everything for today is handled." : "Nothing on the plan for today. The Planner decides the next two weeks — put assignments on the calendar and they'll show up here."}</div>`;
  if (didT.length) {
    h += `<h2>Done today<span class="count">${didT.length}</span></h2>` + didT.map(a => checkRow(a, L)).join("");
  }
  if (defT.length) {
    h += `<h2>Deferred<span class="count">${defT.length}</span></h2>` + defT.map(a => checkRow(a, L)).join("");
  }
  if (L.needsSubmit.length) {
    h += `<h2>Completed — don't forget to submit<span class="count red">${L.needsSubmit.length}</span></h2>`;
    h += L.needsSubmit.map(a => `<div class="nagbox"><div><b>${esc(a.title)}</b><div class="dayline">${esc(a.course)}</div></div>
      <button class="btn small blue" data-submit="${a.id}">Submitted ✓</button></div>`).join("");
  }
  if (L.submittedRecent.length) {
    h += `<h2>Submitted<span class="count">${L.submittedRecent.length}</span></h2>`;
    h += L.submittedRecent.map(a => `<div class="check done-today"><div class="card-top"><p class="title">${esc(a.title)}</p>
      <div><span class="badge submitted">Submitted ✓</span></div></div><p class="course">${esc(a.course)}${sLink(a)}</p>
      <div class="actions"><button class="btn small quiet" data-msub="${a.id}">Undo submitted</button></div></div>`).join("");
  }
  el.innerHTML = h;
}

/* ---------- Planner: 14-day calendar ---------- */
function calChip(a, kind, k, L) {
  const label = kind === "due"
    ? `<b>DUE</b> ${esc(a.title)}<span class="sub">${esc(a.course)}${hasPts(a) ? ` · ${esc(ptsTxt(a))}` : ""}</span>`
    : `${esc(a.title)}<span class="sub">${esc(dayPos(a, k))} · ${esc(a.course)}</span>`;
  return `<button class="dchip ${kind}" data-sel="${a.id}">${label}</button>`;
}

function renderPlanner(L) {
  const el = document.getElementById("tab-planner");
  const t = todayKey();
  const days = [...Array(14)].map((_, i) => dayKey(new Date(Date.now() + i * 864e5)));
  let h = `<div class="stats">
    <button class="stat ${L.triage.length ? "alert" : ""}" data-goto="tackle"><div class="num">${L.triage.length}</div><div class="lbl">Overdue</div><div class="def">Past due, flagged missing, no plan yet</div></button>
    <button class="stat" data-goto="planner"><div class="num">${L.dueWeek.length}</div><div class="lbl">Due this week</div><div class="def">Due in the next 7 days</div></button>
    <button class="stat" data-goto="today"><div class="num">${L.todayActive.length}</div><div class="lbl">Today's work</div><div class="def">Planned portions for today</div></button>
    <button class="stat" data-goto="planner"><div class="num">${L.nodate.length}</div><div class="lbl">No due date</div><div class="def">No deadline in Schoology</div></button>
    <button class="stat" data-goto="grades"><div class="num">${L.recent.length}</div><div class="lbl">Recently graded</div><div class="def">Returned in the last 30 days</div></button>
  </div>`;

  if (L.triage.length) {
    h += `<div class="tray"><h3>Overdue — needs a plan (${L.triage.length})</h3>
      <p class="hint" style="margin:0 0 8px">Tap one, pick a start day, and it gets a 3-day catch-up strip on the calendar.</p>
      <div class="traychips">${L.triage.map(a => `<button class="tchip" data-sel="${a.id}">${esc(a.title)} · ${esc(relDay(effDue(a)))}</button>`).join("")}</div></div>`;
  }

  if (L.expired.length) {
    h += `<h2>Needs rescheduling<span class="count">${L.expired.length}</span></h2>
      <p class="hint">The plan for these ended before the work was finished. Pick a new start day, or close them out — they won't show on Today or the calendar until then.</p>`;
    h += L.expired.map(a => { const s = planOf(a.id), e = endK(a), lastK = e || addDaysK(s, 13);
      return `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
      <p class="course">${esc(a.course)} · plan ran ${esc(planLabel(s))} → ${esc(planLabel(lastK))}, not finished${sLink(a)}</p>
      <div class="decide">
        <button class="btn small primary" data-look="done" data-id="${a.id}">Done ✓</button>
        <button class="btn small blue" data-look="sched" data-id="${a.id}">Reschedule…</button>
        <button class="btn small" data-look="drop" data-id="${a.id}">Set aside</button>
      </div>
      ${statusRow(a, {noDone: true})}
      ${schedFor === a.id ? `<div class="pickrow"><input type="date" id="scheddate" min="${todayKey()}" value="${todayKey()}">
        <button class="btn blue small" data-lookgo="${a.id}">Put on calendar</button></div>` : ""}
    </div>`; }).join("");
  }

  h += `<p class="hint">Assignments sit on the day they're <b>due</b>. Tap one to choose a <b>start day</b> — it then plots a work strip across every day in between, and those days land on the Today checklist.</p>`;
  if (L.unplannedUpcoming.length) {
    h += `<div class="controls"><button class="btn blue" id="autoplan">Auto-plan everything (${L.unplannedUpcoming.length})</button></div>`;
  }

  const weeks = [["This week", days.slice(0, 7)], ["Next week", days.slice(7, 14)]];
  h += weeks.map(([wlabel, wdays]) => `<div class="calweek"><h3>${wlabel}</h3><div class="cal">` +
    wdays.map(k => {
      const dueHere = DATA.assignments.filter(a => {
        const ed = effDue(a);
        return (!courseFilter || a.course === courseFilter) &&
        ed && dayKey(new Date(ed)) === k && !isDone(a.id) && !isSubmitted(a.id) && !isDropped(a.id) && !GRADED(a.status) && !RESOLVED_STATUS(a.status) && !isNoise(a.id) && !isSnoozed(a.id);
      });
      const workHere = DATA.assignments.filter(a => {
        const ed = effDue(a);
        return (!courseFilter || a.course === courseFilter) &&
        planOf(a.id) && activeOn(a, k) && !(ed && dayKey(new Date(ed)) === k);
      });
      return `<div class="daycell ${k === t ? "today" : ""}"><h4>${k === t ? "Today" : planLabel(k)}</h4>
        <div class="dsub">${dueHere.length + workHere.length || ""}</div>` +
        dueHere.map(a => calChip(a, "due", k, L)).join("") +
        workHere.map(a => calChip(a, "work", k, L)).join("") +
        `</div>`;
    }).join("") + `</div></div>`).join("");

  if (selectedId && byId(selectedId)) {
    const a = byId(selectedId), s = planOf(a.id), e = endK(a);
    const ed0 = effDue(a), edK = ed0 ? dayKey(new Date(ed0)) : null;
    const maxD = edK && edK >= t ? edK : dayKey(new Date(Date.now() + 13 * 864e5));
    h += `<div class="detail" id="detailpanel">
      <div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
      <p class="course">${esc(a.course)} · ${esc(a.type || "")}${hasPts(a) ? ` · ${esc(ptsTxt(a))}` : ""}${sLink(a)}</p>
      <div class="meta"><span class="${needsAction(a) ? "due late" : "due"}">${esc(relDay(ed0))}</span>
        ${hasManualDue(a) ? `<span class="tag">due date set by you</span>` : ""}</div>
      ${a.teacher_comment ? `<div class="comment"><b>Teacher comment</b>${esc(a.teacher_comment)}</div>` : ""}
      ${s ? `<p class="hint">On the calendar: <b>${esc(planLabel(s))}</b>${e ? ` → <b>${esc(planLabel(e))}</b> (${workDays(a).length} work days)` : " → until completed"}.</p>`
          : `<p class="hint">Not on the calendar yet. Pick a start day and it will plot daily portions through the due date.</p>`}
      <div class="actions"><input type="date" id="startdate" min="${t}" max="${maxD}" value="${s || suggestStart(a)}">
        <button class="btn blue small" data-setstart="${a.id}">Set start day</button>
        ${s ? `<button class="btn small quiet" data-unplan="${a.id}">Remove from calendar</button>` : ""}
        <button class="btn small quiet" data-sel="">Close</button>
      </div>
      <div class="actions"><label style="font-size:13px;color:var(--muted)" for="duedate">Due date:</label>
        <input type="date" id="duedate" min="${t}" value="${manualDueK(a.id)}">
        <button class="btn small blue" data-ddset="${a.id}">Set due date</button>
        ${manualDueK(a.id) ? `<button class="btn small quiet" data-ddclear="${a.id}">Clear</button>` : ""}
      </div>
      <div class="actions">
        <button class="btn small quiet" data-noise="${a.id}" title="Not real work — hides it from every task list">Noise</button>
        ${snoozeFor === a.id ? snoozePickerRow(a, false)
          : `<button class="btn small quiet" data-snooze="${a.id}" title="Not now — hides it until you bring it back">Snooze</button>`}
      </div>
      ${statusRow(a)}
      <div class="note-row"><textarea placeholder="Add a note…" data-note="${a.id}">${esc(noteOf(a.id))}</textarea></div>
    </div>`;
  }

  if (L.unplannedNodate.length) {
    h += `<h2>No due date — pick a start day or set one<span class="count">${L.unplannedNodate.length}</span></h2>
      <p class="hint">Give one a due date and it joins the calendar like everything else — or pick a start day to work on it without a deadline.</p>`;
    h += L.unplannedNodate.map(a => `<div class="sugrow" style="display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap">
      <div><div style="font-weight:650;font-size:14px">${esc(a.title)}</div><div style="font-size:12px;color:var(--muted)">${esc(a.course)}${sLink(a)}</div></div>
      <div style="flex:1"></div>
      <label style="font-size:12px;color:var(--muted)">Due <input type="date" data-dddate="${a.id}" min="${t}" aria-label="Set a due date"></label>
      <button class="btn small blue" data-ddgo="${a.id}">Set due</button>
      <button class="btn small" data-planstart="${a.id}" data-day="${t}">Start today</button>
      <input type="date" data-nddate="${a.id}" min="${t}" value="${t}" aria-label="Choose a start day">
      <button class="btn small blue" data-ndgo="${a.id}">Set</button>
      <button class="btn small quiet" data-noise="${a.id}" title="Not real work — hides it from every task list">Noise</button>
      ${snoozeFor === a.id
        ? `<span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--muted)">Snooze for:</span>${snoozeChips(a, false)}<button class="btn small quiet" data-snoozecancel title="Cancel">✕</button></span>`
        : `<button class="btn small quiet" data-snooze="${a.id}" title="Not now — hides it until you bring it back">Snooze</button>`}</div>`).join("");
  }

  if (L.snoozed.length) {
    h += `<h2>Snoozed — not now<span class="count">${L.snoozed.length}</span></h2>
      <p class="hint">Hidden from every task list until you bring one back.</p>`;
    h += L.snoozed.map(a => `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p>
      <button class="btn small" data-unsnooze="${a.id}">Bring back</button></div>
      <p class="course">${esc(a.course)} · ${esc(relDay(effDue(a)))}${sLink(a)}</p>
      <p class="hint">${esc(wakeLabel(a.id))}</p></div>`).join("");
  }
  el.innerHTML = h;
}

/* ---------- Tackle: the intake inbox for overdue ---------- */
function ageHint(a) {
  const days = Math.max(1, Math.round((Date.now() - new Date(effDue(a))) / 864e5));
  if (days <= 3) return `Overdue ${days} day${days === 1 ? "" : "s"} — suggestion: start it today.`;
  if (days <= 14) return `Overdue ${days} days — suggestion: give it a start day this week.`;
  return `Overdue ${days} days — suggestion: schedule a 3-day catch-up, or set it aside if it's not going to happen.`;
}
function renderTackle(L) {
  const el = document.getElementById("tab-tackle");
  const q = L.triage;
  let h = `<p class="hint"><b>Tackle is the inbox.</b> Every overdue assignment waits here until someone makes a call on it — done, submitted, scheduled onto the calendar, or set aside. Once decided, it leaves this list.</p>`;
  if (triageSession && triagePos < q.length) {
    const a = q[triagePos];
    const decided = triageSummary.done + triageSummary.planned + triageSummary.dropped + triageSummary.submitted + triageSummary.noise + triageSummary.snoozed;
    h += `<div class="focus">
      <div class="focus-progress">Tackle the backlog · ${decided} of ${q.length} decided</div>
      <p class="title">${esc(a.title)}</p>
      <p class="course">${esc(a.course)}</p>
      <div class="meta"><span class="tag">${esc(a.type || "other")}</span>
        ${hasPts(a) ? `<span class="tag">${esc(ptsTxt(a))}</span>` : ""}
        <span class="due late">${esc(relDay(effDue(a)))}</span>${sLink(a)}</div>
      ${a.teacher_comment ? `<div class="comment"><b>Teacher comment</b>${esc(a.teacher_comment)}</div>` : ""}
      <div class="suggest">💡 ${esc(ageHint(a))}</div>
      <div class="note-row"><textarea placeholder="Add a note…" data-note="${a.id}">${esc(noteOf(a.id))}</textarea></div>
      <div class="decide">
        <button class="btn primary" data-tdec="done" data-id="${a.id}">Done ✓</button>
        <button class="btn blue" data-tdec="sub" data-id="${a.id}">Submitted ✓</button>
        <button class="btn blue" data-tdec="sched" data-id="${a.id}">Schedule…</button>
        <button class="btn" data-tdec="drop" data-id="${a.id}">Set aside</button>
        <button class="btn quiet" data-tdec="noise" data-id="${a.id}" title="Not real work — removes it from every task list">Noise</button>
        ${snoozeFor === a.id ? snoozePickerRow(a, true)
          : `<button class="btn quiet" data-tdec="snooze" data-id="${a.id}" title="Not now — hides it until you bring it back">Snooze</button>`}
        <button class="btn quiet" data-tdec="skip">Skip →</button>
        <button class="btn quiet" data-tdec="exit">← All pills</button>
      </div>
      ${schedFor === a.id ? `<div class="pickrow"><input type="date" id="scheddate" min="${todayKey()}" value="${todayKey()}">
        <button class="btn blue" data-tdec="schedgo" data-id="${a.id}">Put on calendar</button></div>` : ""}
    </div>`;
  } else {
    if (triageSession && triagePos >= q.length && triageSummary) {
      const s = triageSummary;
      h += `<div class="summary"><b>Backlog tackled.</b> Done: ${s.done} · Submitted: ${s.submitted} · Scheduled: ${s.planned} · Set aside: ${s.dropped}${s.noise ? ` · Noise: ${s.noise}` : ""}${s.snoozed ? ` · Snoozed: ${s.snoozed}` : ""}${s.skipped ? ` · Skipped: ${s.skipped}` : ""}.</div>`;
      triageSession = false;
    }
    if (q.length) {
      h += `<div class="tray"><h3>${q.length} overdue item${q.length === 1 ? "" : "s"} waiting for a decision</h3>
        <div class="traychips" style="margin-bottom:10px">${q.map(a => `<button class="tchip" data-tsel="${a.id}">${esc(a.title)}</button>`).join("")}</div>
        <button class="btn blue" id="startTackle">Tackle one at a time</button></div>`;
    } else {
      h += `<div class="summary"><b>Inbox zero.</b> Nothing overdue is waiting for a decision.</div>`;
    }
  }
  const sched = L.overdue.filter(a => planOf(a.id));
  if (sched.length) {
    h += `<h2>Overdue, on the calendar<span class="count">${sched.length}</span></h2>`;
    h += sched.map(a => { const s = planOf(a.id), e = endK(a);
      return `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
      <p class="course">${esc(a.course)} · catch-up strip ${esc(planLabel(s))}${e ? " → " + esc(planLabel(e)) : ""}${sLink(a)}</p>
      <div class="actions" style="display:flex;gap:8px;margin-top:6px"><button class="btn small" data-goto="planner">See on calendar</button>
      <button class="btn small quiet" data-unplan="${a.id}">Unschedule</button></div>
      ${statusRow(a)}</div>`; }).join("");
  }
  if (L.look.length) {
    h += `<h2>Needs a look — past due, unclear status<span class="count">${L.look.length}</span></h2>
      <p class="hint">Schoology shows no usable status for these. Give each the same treatment: done, submitted, scheduled, or set aside.</p>`;
    h += L.look.map(a => `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p><div>${statusBadge(a)}</div></div>
      <p class="course">${esc(a.course)} · ${esc(relDay(effDue(a)))}${a.status ? ` · status: ${esc(a.status)}` : ""}${sLink(a)}</p>
      <div class="decide">
        <button class="btn small primary" data-look="done" data-id="${a.id}">Done ✓</button>
        <button class="btn small blue" data-look="sched" data-id="${a.id}">Schedule…</button>
        <button class="btn small" data-look="drop" data-id="${a.id}">Set aside</button>
        <button class="btn small quiet" data-look="noise" data-id="${a.id}" title="Not real work — removes it from every task list">Noise</button>
        ${snoozeFor === a.id ? snoozePickerRow(a, false)
          : `<button class="btn small quiet" data-look="snooze" data-id="${a.id}" title="Not now — hides it until you bring it back">Snooze</button>`}
      </div>
      ${statusRow(a, {noDone: true})}
      ${schedFor === a.id ? `<div class="pickrow"><input type="date" id="scheddate" min="${todayKey()}" value="${todayKey()}">
        <button class="btn blue small" data-lookgo="${a.id}">Put on calendar</button></div>` : ""}
    </div>`).join("");
  }
  if (L.dropped.length) {
    h += `<h2>Set aside<span class="count">${L.dropped.length}</span></h2>`;
    h += L.dropped.map(a => `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p>
      <button class="btn small" data-bringback="${a.id}">Bring back</button></div>
      <p class="course">${esc(a.course)} · ${esc(relDay(effDue(a)))}${sLink(a)}</p>
      ${statusRow(a)}</div>`).join("");
  }
  if (L.noise.length) {
    h += `<h2>Marked as noise<span class="count">${L.noise.length}</span></h2>
      <p class="hint">Not real work — participation grades and other Schoology clutter. Hidden from every task list.</p>`;
    h += L.noise.map(a => `<div class="card"><div class="card-top"><p class="title">${esc(a.title)}</p>
      <button class="btn small" data-unnoise="${a.id}">Restore</button></div>
      <p class="course">${esc(a.course)} · ${esc(relDay(effDue(a)))}${sLink(a)}</p></div>`).join("");
  }
  el.innerHTML = h;
}

/* ---------- Grades ---------- */
// Course grades arrive as one string ("D 43.53%", "B", "94.59%", "-").
// Parse it into letter + percent without inventing values from thin air.
function parseCourseGrade(g) {
  const out = {};
  const s = (g == null ? "" : String(g)).trim();
  if (!s || s === "-") return out;
  const m = s.match(/^([A-F][+-]?)?\s*(\d+(?:\.\d+)?)?\s*%?\s*$/i);
  if (!m) { out.raw = s; return out; }
  if (m[1]) out.letter = m[1].toUpperCase();
  if (m[2] !== undefined && m[2] !== "") out.pct = parseFloat(m[2]);
  return out;
}
function renderGrades(L) {
  const el = document.getElementById("tab-grades");
  el.innerHTML = `<h2>Grades</h2><div class="grades">` + DATA.courses
    .map(c => {
      const pg = parseCourseGrade(c.grade);
      const letter = c.grade_letter || pg.letter;
      const pct = c.grade_pct != null ? c.grade_pct : pg.pct;
      const val = letter ? esc(letter) : (pg.raw ? esc(pg.raw) : "—");
      return `<div class="grade-card"><div class="g-course">${esc(c.name)}</div>
        <div class="g-val">${val}${pct != null ? ` <span style="font-size:14px;color:var(--muted)">${pct}%</span>` : ""}</div></div>`;
    }).join("")
    + `</div><h2>Recently graded<span class="count">${L.recent.length}</span></h2>`
    + (L.recent.length ? L.recent.map(card).join("") : `<div class="empty">Nothing in the last 30 days.</div>`);
}

/* ---------- render + events ---------- */
function tdecide(action, id, days) {
  const t = Date.now();
  if (action === "snooze") { snoozeFor = (snoozeFor === id ? null : id); render(); return; }
  snoozeFor = null;
  if (action === "done") { done[id] = {v: true, ts: t}; triageSummary.done++; }
  else if (action === "sub") { submitted[id] = {v: true, ts: t}; triageSummary.submitted++; }
  else if (action === "noise") { noise[id] = {v: true, ts: t}; triageSummary.noise++; }
  else if (action === "snoozego") {
    snoozed[id] = {v: true, ts: t, until: days ? snoozeUntil(parseInt(days, 10)) : null};
    triageSummary.snoozed++;
  }
  else if (action === "exit") { triageSession = false; schedFor = null; render(); return; }
  else if (action === "schedgo") {
    const inp = document.getElementById("scheddate");
    if (inp && inp.value) { plan[id] = {v: inp.value, ts: t}; triageSummary.planned++; }
    schedFor = null;
  }
  else if (action === "sched") { schedFor = (schedFor === id ? null : id); render(); return; }
  else if (action === "drop") { dropped[id] = {v: true, ts: t}; triageSummary.dropped++; }
  else if (action === "skip") { triageSummary.skipped++; triagePos++; render(); return; }
  saveLocal(); pushSoon(400); render();
}

function render() {
  const L = lists();
  const tb = document.getElementById("tackleBadge");
  tb.style.display = L.triage.length ? "" : "none";
  tb.textContent = L.triage.length;
  renderToday(L); renderPlanner(L); renderTackle(L); renderGrades(L);

  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => switchTab(b.dataset.goto));
  document.querySelectorAll("[data-note]").forEach(t => {
    t.oninput = () => { notes[t.dataset.note] = {v: t.value, ts: Date.now()}; saveLocal(); pushSoon(1500); };
  });
  // Today checklist
  document.querySelectorAll("[data-did]").forEach(b => b.onclick = () => {
    daily[b.dataset.did + "||" + todayKey()] = {v: "did", ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-defer]").forEach(b => b.onclick = () => { deferFor = b.dataset.defer; render(); });
  document.querySelectorAll("[data-defercancel]").forEach(b => b.onclick = () => { deferFor = null; render(); });
  document.querySelectorAll("[data-defergo]").forEach(b => b.onclick = () => {
    const inp = document.getElementById("deferreason");
    const reason = inp ? inp.value.trim() : "";
    if (!reason) { if (inp) { inp.style.borderColor = "var(--red)"; inp.placeholder = "A reason is required to defer."; inp.focus(); } return; }
    daily[b.dataset.defergo + "||" + todayKey()] = {v: "deferred", note: reason, ts: Date.now()};
    deferFor = null; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-complete]").forEach(b => b.onclick = () => {
    done[b.dataset.complete] = {v: true, ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-submit]").forEach(b => b.onclick = () => {
    submitted[b.dataset.submit] = {v: true, ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  // Planner
  document.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => {
    selectedId = b.dataset.sel || null; render();
    if (selectedId) { const p = document.getElementById("detailpanel"); if (p) p.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  });
  document.querySelectorAll("[data-setstart]").forEach(b => b.onclick = () => {
    const inp = document.getElementById("startdate");
    if (inp && inp.value) { plan[b.dataset.setstart] = {v: inp.value, ts: Date.now()}; saveLocal(); pushSoon(400); render(); }
  });
  document.querySelectorAll("[data-unplan]").forEach(b => b.onclick = () => {
    plan[b.dataset.unplan] = {v: "", ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-planstart]").forEach(b => b.onclick = () => {
    plan[b.dataset.planstart] = {v: b.dataset.day, ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-ndgo]").forEach(b => b.onclick = () => {
    const inp = document.querySelector(`[data-nddate="${b.dataset.ndgo}"]`);
    if (inp && inp.value) { plan[b.dataset.ndgo] = {v: inp.value, ts: Date.now()}; saveLocal(); pushSoon(400); render(); }
  });
  // Manual due dates (no-due-date rows + Planner detail panel)
  document.querySelectorAll("[data-ddgo]").forEach(b => b.onclick = () => {
    const inp = document.querySelector(`[data-dddate="${b.dataset.ddgo}"]`);
    if (inp && inp.value) { duedates[b.dataset.ddgo] = {v: inp.value, ts: Date.now()}; saveLocal(); pushSoon(400); render(); }
  });
  document.querySelectorAll("[data-ddset]").forEach(b => b.onclick = () => {
    const inp = document.getElementById("duedate");
    if (inp && inp.value) { duedates[b.dataset.ddset] = {v: inp.value, ts: Date.now()}; saveLocal(); pushSoon(400); render(); }
  });
  document.querySelectorAll("[data-ddclear]").forEach(b => b.onclick = () => {
    duedates[b.dataset.ddclear] = {v: "", ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  const ap = document.getElementById("autoplan");
  if (ap) ap.onclick = () => {
    const t = Date.now();
    lists().unplannedUpcoming.forEach(a => { plan[a.id] = {v: suggestStart(a), ts: t}; });
    lists().triage.forEach(a => { if (!planOf(a.id)) plan[a.id] = {v: todayKey(), ts: t}; });
    saveLocal(); pushSoon(500); render();
  };
  // Tackle
  document.querySelectorAll("[data-tdec]").forEach(b => b.onclick = () => tdecide(b.dataset.tdec, b.dataset.id, b.dataset.days));
  // Noise + snooze: one-way marks; restore lives in the Tackle/Planner sections
  document.querySelectorAll("[data-noise]").forEach(b => b.onclick = () => {
    const id = b.dataset.noise;
    noise[id] = {v: true, ts: Date.now()};
    if (selectedId === id) selectedId = null;
    saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-unnoise]").forEach(b => b.onclick = () => {
    noise[b.dataset.unnoise] = {v: false, ts: Date.now()};
    saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-snooze]").forEach(b => b.onclick = () => {
    const id = b.dataset.snooze;
    snoozeFor = (snoozeFor === id ? null : id);
    render();
  });
  document.querySelectorAll("[data-snoozego]").forEach(b => b.onclick = () => {
    const id = b.dataset.snoozego, d = b.dataset.days ? parseInt(b.dataset.days, 10) : 0;
    snoozed[id] = {v: true, ts: Date.now(), until: d ? snoozeUntil(d) : null};
    if (selectedId === id) selectedId = null;
    snoozeFor = null;
    saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-snoozecancel]").forEach(b => b.onclick = () => {
    snoozeFor = null; render();
  });
  document.querySelectorAll("[data-unsnooze]").forEach(b => b.onclick = () => {
    snoozed[b.dataset.unsnooze] = {v: false, ts: Date.now()};
    saveLocal(); pushSoon(400); render();
  });
  // Unified status buttons (every card, every tab)
  document.querySelectorAll("[data-mdone]").forEach(b => b.onclick = () => {
    const id = b.dataset.mdone, t = Date.now();
    done[id] = {v: !isDone(id), ts: t}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-msub]").forEach(b => b.onclick = () => {
    const id = b.dataset.msub, t = Date.now();
    submitted[id] = {v: !isSubmitted(id), ts: t}; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-tsel]").forEach(b => b.onclick = () => {
    const id = b.dataset.tsel;
    triageSession = true; schedFor = null;
    triageSummary = {done: 0, planned: 0, dropped: 0, skipped: 0, submitted: 0, noise: 0, snoozed: 0};
    const q = lists().triage; triagePos = Math.max(0, q.findIndex(a => a.id === id));
    render();
  });
  document.querySelectorAll("[data-look]").forEach(b => b.onclick = () => {
    const t = Date.now(), id = b.dataset.id, act = b.dataset.look;
    if (act === "done") { done[id] = {v: true, ts: t}; }
    else if (act === "drop") { dropped[id] = {v: true, ts: t}; }
    else if (act === "noise") { noise[id] = {v: true, ts: t}; }
    else if (act === "snooze") { snoozeFor = (snoozeFor === id ? null : id); render(); return; }
    else if (act === "sched") { schedFor = (schedFor === id ? null : id); render(); return; }
    schedFor = null; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-lookgo]").forEach(b => b.onclick = () => {
    const inp = document.getElementById("scheddate");
    if (inp && inp.value) { plan[b.dataset.lookgo] = {v: inp.value, ts: Date.now()}; }
    schedFor = null; saveLocal(); pushSoon(400); render();
  });
  document.querySelectorAll("[data-bringback]").forEach(b => b.onclick = () => {
    dropped[b.dataset.bringback] = {v: false, ts: Date.now()}; saveLocal(); pushSoon(400); render();
  });
  const st = document.getElementById("startTackle");
  if (st) st.onclick = () => {
    triageSession = true; triagePos = 0; schedFor = null;
    triageSummary = {done: 0, planned: 0, dropped: 0, skipped: 0, submitted: 0, noise: 0, snoozed: 0};
    render();
  };
}
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  ["today", "planner", "tackle", "grades"].forEach(t =>
    document.getElementById("tab-" + t).style.display = t === name ? "" : "none");
  window.scrollTo(0, 0);
}
function renderPreserveFocus() {
  const ae = document.activeElement;
  const nk = ae && ae.dataset ? ae.dataset.note : null;
  const pos = ae && nk ? ae.selectionStart : null;
  const dr = ae && ae.id === "deferreason" ? {s: ae.selectionStart, v: ae.value} : null;
  render();
  if (nk) {
    const t = document.querySelector('[data-note="' + nk + '"]');
    if (t) { t.focus(); if (pos != null) { try { t.setSelectionRange(pos, pos); } catch (e) {} } }
  } else if (dr) {
    const inp = document.getElementById("deferreason");
    if (inp) { inp.value = dr.v; inp.focus(); try { inp.setSelectionRange(dr.s, dr.s); } catch (e) {} }
  }
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

fetch("schoology.json").then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("fetched").textContent =
    "Updated " + new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ }).format(new Date(d.fetched_at));
  const sel = document.getElementById("courseFilter");
  [...new Set(d.assignments.map(a => a.course))].sort().forEach(c => {
    const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  sel.onchange = () => { courseFilter = sel.value; selectedId = null; render(); };
  migrateLegacy();
  render();
  pullState(changed => {
    if (!changed) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    if (triageSession) return;
    renderPreserveFocus();
  });
  setInterval(() => pullState(changed => {
    if (!changed) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    if (triageSession) return;
    renderPreserveFocus();
  }), 60000);
}).catch(() => { document.getElementById("fetched").textContent = "Could not load data."; });
</script>
